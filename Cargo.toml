[package]
name = "lazystash"
version = "0.1.3"
edition = "2021"
description = "Browse, preview, and pop git stashes in a terminal UI"
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/tanishq-khandelwal/lazystash"
exclude = [".github/", "npm/", "*.gif", "*.png"]
categories = ["command-line-utilities", "development-tools"]
keywords = ["git", "stash", "tui", "cli"]

[[bin]]
name = "lazystash"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1"

[profile.release]
strip = true
lto = true
opt-level = "z"
