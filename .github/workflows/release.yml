name: release
# Publishing happens only on main. Work lands on develop; a release is a
# develop -> main merge, and the version in the manifests decides what ships.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The manifests must agree: npm/install.js builds its download URL from its
  # own version field, so a stale one would 404 for every installer.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        shell: bash
        run: |
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          npm_v=$(node -p "require('./npm/package.json').version")
          echo "cargo=$cargo_v npm=$npm_v"
          [ "$cargo_v" = "$npm_v" ] || { echo "::error::Cargo.toml $cargo_v != npm/package.json $npm_v"; exit 1; }
          echo "version=$cargo_v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - name: Install cross (linux)
        if: runner.os == 'Linux'
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Archive
        shell: bash
        run: |
          bin=lazystash; ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          archive=lazystash-${{ matrix.target }}.tar.gz
          tar czf "$archive" -C target/${{ matrix.target }}/release "$bin$ext"
          # sha256sum is missing on macOS, shasum is missing on Windows Git Bash.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            lazystash-*.tar.gz
            lazystash-*.tar.gz.sha256
          generate_release_notes: true

  # Publish after every target built: a registry version can be yanked or
  # unpublished but never replaced, so a partial release must not ship.
  publish-crates:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish unless this version is already on crates.io
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          if curl -sfA lazystash-ci "https://crates.io/api/v1/crates/lazystash/$V" >/dev/null; then
            echo "lazystash $V is already published - skipping"
          else
            cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi

  # Also after build: the npm package carries no binary - its postinstall
  # downloads the release archive, so the assets must exist first.
  publish-npm:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance signs the package against this repo, workflow, and commit,
      # which is what makes npmjs.com show the verified link back to GitHub.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Root README doubles as the npm listing page rather than a second copy.
      - run: cp README.md npm/README.md
      - name: Verify the published binary installs and runs
        working-directory: npm
        run: |
          node install.js
          node bin/cli.js --version
      - name: Publish unless this version is already on npm
        working-directory: npm
        env:
          V: ${{ needs.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "lazystash@$V" version >/dev/null 2>&1; then
            echo "lazystash $V is already published - skipping"
          else
            npm publish --access public --provenance
          fi
