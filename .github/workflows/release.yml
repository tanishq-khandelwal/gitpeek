name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse to ship if the tag and the manifests disagree - a mismatch would publish
  # the wrong version, and npm/install.js derives its download URL from its own
  # version field, so a stale one would 404 for every installer.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          npm_v=$(node -p "require('./npm/package.json').version")
          echo "tag=$tag cargo=$cargo_v npm=$npm_v"
          [ "$tag" = "$cargo_v" ] || { echo "::error::tag v$tag != Cargo.toml $cargo_v"; exit 1; }
          [ "$tag" = "$npm_v" ] || { echo "::error::tag v$tag != npm/package.json $npm_v"; exit 1; }

  build:
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - name: Install cross (linux)
        if: runner.os == 'Linux'
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Archive
        shell: bash
        run: |
          bin=lazystash; ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          tar czf lazystash-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release "$bin$ext"
          archive=lazystash-${{ matrix.target }}.tar.gz
          # sha256sum is missing on macOS, shasum is missing on Windows Git Bash.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            lazystash-*.tar.gz
            lazystash-*.tar.gz.sha256
          generate_release_notes: true

  # Publish last: if any target fails to build, nothing goes to crates.io (which is
  # permanent - versions can only be yanked, never replaced).
  publish-crates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish unless this version is already on crates.io
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if curl -sfA lazystash-ci "https://crates.io/api/v1/crates/lazystash/$v" >/dev/null; then
            echo "lazystash $v is already published - skipping"
          else
            cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
          fi

  # Also after build: the npm package has no binary in it - its postinstall
  # downloads the release archive, so the assets must exist first.
  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Root README doubles as the npm listing page rather than a second copy.
      - run: cp README.md npm/README.md
      - name: Verify the published binary installs and runs
        working-directory: npm
        run: |
          node install.js
          node bin/cli.js --version
      - name: Publish unless this version is already on npm
        working-directory: npm
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "lazystash@$v" version >/dev/null 2>&1; then
            echo "lazystash $v is already published - skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
