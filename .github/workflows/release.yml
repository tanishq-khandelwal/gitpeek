name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse to ship if the tag and Cargo.toml disagree - a mismatch would publish
  # the wrong version to crates.io and mislabel the release archives.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag manifest=$manifest"
          [ "$tag" = "$manifest" ] || { echo "::error::tag v$tag != Cargo.toml $manifest"; exit 1; }

  build:
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - name: Install cross (linux)
        if: runner.os == 'Linux'
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Archive
        shell: bash
        run: |
          bin=git-peek; ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          tar czf gitpeek-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release "$bin$ext"
          shasum -a 256 gitpeek-${{ matrix.target }}.tar.gz > gitpeek-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gitpeek-*.tar.gz
            gitpeek-*.tar.gz.sha256
          generate_release_notes: true

  # Publish last: if any target fails to build, nothing goes to crates.io (which is
  # permanent - versions can only be yanked, never replaced).
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
